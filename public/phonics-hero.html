<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>拼读小能手 · Phonics Hero — 6款互动小游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8e7; --sky:#7ec8ff; --sky2:#4ea8e8;
  --sun:#ffd84d; --sun2:#ffb800; --grass:#6dd47e; --grass2:#3cb878;
  --coral:#ff8a6b; --coral2:#ff6b4a; --grape:#b794f6; --grape2:#9f7aea;
  --ink:#2d3142; --ink2:#5a6072; --card:#fff; --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:'Nunito','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;min-height:100vh}
h1,h2,h3{font-family:'Baloo 2','PingFang SC',sans-serif}

/* 顶部导航 */
.nav{position:sticky;top:0;z-index:100;background:rgba(255,248,231,.94);backdrop-filter:blur(10px);border-bottom:3px solid rgba(126,200,255,.25);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}
.brand .logo{font-size:26px}
.brand .en{color:var(--sky2)}
.score-pill{background:var(--sun);color:var(--ink);padding:4px 12px;border-radius:30px;font-weight:800;font-size:14px}

/* 英雄区 */
.hero{padding:36px 20px 28px;text-align:center}
.hero h1{font-size:28px;font-weight:800}
.hero .en-sub{font-size:16px;color:var(--sky2);display:block;margin-top:2px;font-weight:700}
.hero p{font-size:14px;color:var(--ink2);margin-top:6px;max-width:520px;margin-left:auto;margin-right:auto}
.hero .source{margin-top:6px;font-size:12px;color:var(--grape2);font-weight:700}

/* 游戏选择 */
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:8px 20px 28px;max-width:760px;margin:0 auto}
.game-card{background:var(--card);border-radius:var(--r);padding:20px 14px;text-align:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.06),0 8px 16px rgba(0,0,0,.08);border:3px solid transparent;transition:transform .12s,border-color .12s;user-select:none;width:100%;min-width:0}
.game-card:active{transform:scale(.96)}
.game-card.active{border-color:var(--coral);box-shadow:0 4px 0 rgba(0,0,0,.06),0 8px 16px rgba(255,107,74,.15)}
.game-card .icon{font-size:40px;display:block;margin-bottom:6px}
.game-card .title{font-weight:800;font-size:15px}
.game-card .desc{font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.4}
.game-card .stars{margin-top:6px;font-size:12px;color:var(--sun2);font-weight:700}

/* 游戏主区域 */
.game-area{max-width:760px;margin:0 auto;padding:0 20px 40px}
.question-card{background:var(--card);border-radius:20px;padding:24px 20px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.06),0 12px 24px rgba(0,0,0,.1);margin-bottom:18px}
.q-category{font-size:12px;color:var(--sky2);font-weight:800;text-transform:uppercase;letter-spacing:1px}
.q-word{font-family:'Baloo 2',sans-serif;font-size:54px;font-weight:800;color:var(--coral2);margin:8px 0 4px;letter-spacing:2px}
.q-ipa{font-size:16px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.q-meaning{font-size:14px;color:var(--ink2);margin-bottom:8px}
.q-meaning strong{color:var(--coral2);font-weight:800}
.q-tip{font-size:13px;color:var(--grape2);font-weight:700;background:rgba(183,148,246,.12);display:inline-block;padding:4px 14px;border-radius:20px;margin-bottom:6px}
.q-play{display:inline-flex;align-items:center;gap:6px;margin:10px auto 0;cursor:pointer;background:rgba(126,200,255,.15);border:none;font-size:14px;color:var(--sky2);font-weight:800;padding:8px 18px;border-radius:30px;transition:background .15s,transform .1s;font-family:inherit}
.q-play:hover{background:rgba(126,200,255,.3)}
.q-play:active{transform:scale(.94)}

/* 选项 */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:4px}
.opt{padding:14px 10px;border-radius:14px;border:3px solid transparent;background:rgba(255,255,255,.85);cursor:pointer;font-weight:800;font-size:18px;text-align:center;transition:all .12s;user-select:none;font-family:'Baloo 2',sans-serif;color:var(--ink);width:100%;min-width:0;box-shadow:0 2px 0 rgba(0,0,0,.05)}
.opt:active{transform:scale(.95)}
.opt.correct{background:#c6f0d4;border-color:var(--grass2);color:#1b8a4d;animation:pop .3s}
.opt.wrong{background:#ffcccc;border-color:var(--coral2);color:#c0392b;animation:shake .4s}
.opt.dim{opacity:.4;pointer-events:none}

@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 统计 */
.stats-row{display:flex;justify-content:center;gap:16px;margin-top:14px;font-size:13px;font-weight:700;color:var(--ink2);flex-wrap:wrap}
.stat{background:var(--card);padding:6px 14px;border-radius:20px;box-shadow:0 2px 4px rgba(0,0,0,.06)}
.correct-stat{color:var(--grass2)} .wrong-stat{color:var(--coral2)}

/* 完成 */
.complete{display:none;background:var(--card);border-radius:24px;padding:36px 24px;text-align:center;max-width:380px;margin:40px auto;box-shadow:0 8px 0 rgba(0,0,0,.06),0 20px 40px rgba(0,0,0,.12);animation:slideUp .4s}
.complete.show{display:block}
.complete .trophy{font-size:72px}
.complete h2{font-size:24px;font-weight:800;margin:8px 0 4px}
.complete .stats{font-size:14px;color:var(--ink2);margin:8px 0}

/* 词族 */
.family-word{font-family:'Baloo 2',sans-serif;font-size:64px;font-weight:800;letter-spacing:6px;color:var(--sky2);margin:16px 0}
.family-word .blank{display:inline-block;min-width:50px;border-bottom:6px solid var(--coral2);color:var(--coral2)}
.family-hint{font-size:14px;color:var(--ink2);margin-bottom:6px}
.family-meaning{font-size:13px;color:var(--grape2);font-weight:700;margin-bottom:4px}

/* 魔术E */
.magic-pair{display:flex;gap:16px;justify-content:center;align-items:center;margin:16px 0;flex-wrap:wrap}
.magic-word{font-family:'Baloo 2',sans-serif;font-size:42px;font-weight:800;padding:14px 22px;border-radius:16px;letter-spacing:2px}
.magic-word.short{background:rgba(126,200,255,.15);color:var(--sky2)}
.magic-word.long{background:rgba(255,216,77,.25);color:#b8860b}
.magic-arrow{font-size:28px;color:var(--ink2)}
.magic-e{display:inline-block;color:var(--coral2);font-weight:800}

/* 辅音组合 */
.blend-word{font-family:'Baloo 2',sans-serif;font-size:48px;font-weight:800;color:var(--coral2);margin:16px 0;letter-spacing:2px}

/* 页脚 */
.footer{background:var(--ink);color:#a0a8bd;text-align:center;padding:24px 20px;font-size:12px;line-height:1.8;margin-top:30px}

@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:480px){
  .hero h1{font-size:22px}.hero .en-sub{font-size:14px}
  .game-grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 12px 20px}
  .game-card{padding:14px 10px}.game-card .icon{font-size:32px}
  .q-word{font-size:40px}.opts{grid-template-columns:repeat(2,1fr)}
  .brand{font-size:16px}.stats-row{gap:8px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="brand"><span class="logo">🦉</span><span>拼读小能手 <span class="en">Phonics Hero</span></span></div>
  <span class="score-pill">⭐ <span id="totalStars">0</span></span>
</nav>

<header class="hero">
  <h1><span style="color:var(--coral2)">拼读小能手</span><span class="en-sub">Phonics Hero — Mini Games</span></h1>
  <p>从《斗半匠自然拼读记单词一本通》精选130条规则，化身为6款互动小游戏！</p>
  <p class="source">📖 Source: 斗半匠《自然拼读记单词一本通》24春 · 每日一规则，见词就能读</p>
</header>

<section class="game-grid" id="gameGrid"></section>

<section class="game-area" id="gameArea"></section>

<footer class="footer">
  <strong>📚 内容来源 / Content Source:</strong> 斗半匠编辑室《自然拼读记单词一本通》(2023) — 130条拼读规则 · 800常用词汇<br>
  <p>拼读小能手 Phonics Hero · 使用 Web Speech API 语音合成 · 适合小学生自然拼读启蒙</p>
</footer>

<script>
'use strict';

// ─── 数据（斗半匠 PDF 提取整理）───
const LETTERS=[
 {l:'a',ipa:'/æ/',hint:'嘴张三指',word:'ant',cn:'蚂蚁',tip:'The ant has an apple as food at home.'},
 {l:'b',ipa:'/b/',hint:'双唇相碰',word:'banana',cn:'香蕉',tip:'A boy buys some bananas for his baby brother.'},
 {l:'c',ipa:'/k/',hint:'像蜗牛重壳',word:'cow',cn:'奶牛',tip:'Act like a cow with a cup of cola.'},
 {l:'d',ipa:'/d/',hint:'像扇门',word:'dance',cn:'跳舞',tip:'A lady dances around the desk one day.'},
 {l:'e',ipa:'/e/',hint:'嘴张一指',word:'egg',cn:'蛋',tip:'This elephant likes eggs best.'},
 {l:'f',ipa:'/f/',hint:'上牙碰下唇',word:'fish',cn:'鱼',tip:'Five cats like four fish for lunch.'},
 {l:'g',ipa:'/g/',hint:'像大山喊g',word:'garden',cn:'花园',tip:'A good girl goes to the garden with a goat.'},
 {l:'h',ipa:'/h/',hint:'轻轻呵气',word:'help',cn:'帮助',tip:'Hello, please help me park here.'},
 {l:'i',ipa:'/ɪ/',hint:'轻轻咧嘴',word:'in',cn:'在里',tip:'Give him a gift if he is there.'},
 {l:'j',ipa:'/dʒ/',hint:'像拐杖',word:'job',cn:'工作',tip:'Joe likes to drink juice in June.'},
 {l:'k',ipa:'/k/',hint:'很口渴',word:'key',cn:'钥匙',tip:'This man drinking milk likes cooking.'},
 {l:'l',ipa:'/l/',hint:'后有元音快乐',word:'lion',cn:'狮子',tip:'The pilot loves the plan to fly a plane.'},
 {l:'m',ipa:'/m/',hint:'像山峰闭嘴',word:'money',cn:'钱',tip:'The man climbs a mountain on a warm morning.'},
 {l:'n',ipa:'/n/',hint:'像扇门舌尖上腭',word:'no',cn:'不',tip:'Only one kind animal won the game in the end.'},
 {l:'o',ipa:'/ɒ/',hint:'双唇噘起',word:'orange',cn:'橙子',tip:'He lost lots of oranges on the box.'},
 {l:'p',ipa:'/p/',hint:'和b是一家',word:'panda',cn:'大熊猫',tip:'Mr Panda, please have some pizza.'},
 {l:'q',ipa:'/kw/',hint:'u不分家',word:'queen',cn:'女王',tip:'Answer the queen and answer quickly.'},
 {l:'r',ipa:'/r/',hint:'像豆芽脆弱',word:'robot',cn:'机器人',tip:'The reporter sees a robot in the library every day.'},
 {l:'s',ipa:'/s/',hint:'像小蛇',word:'sister',cn:'姐妹',tip:'My sister sits beside the sofa and sends messages.'},
 {l:'t',ipa:'/t/',hint:'像伞柄',word:'tiger',cn:'老虎',tip:'The tiger near the table has a long tail.'},
 {l:'u',ipa:'/ʌ/',hint:'舌抵下齿',word:'cup',cn:'杯子',tip:'The bus runs in the sun, through the mud.'},
 {l:'v',ipa:'/v/',hint:'上牙碰下唇',word:'very',cn:'非常',tip:'Very little love lives in five lives.'},
 {l:'w',ipa:'/w/',hint:'双唇拢圆',word:'water',cn:'水',tip:'Why do we win the water game?'},
 {l:'x',ipa:'/ks/',hint:'双音合发',word:'fox',cn:'狐狸',tip:'Six foxes in the box take a taxi to the exit.'},
 {l:'y',ipa:'/j/',hint:'半元音',word:'yes',cn:'是',tip:'Yes, you are young and yellow like yesterday.'},
 {l:'z',ipa:'/z/',hint:'像蜜蜂嗡嗡',word:'zoo',cn:'动物园',tip:'Zero zebras zip to the zoo.'},
];

const FAMILIES=[
 {fam:'-at',vowel:'a',ipa:'/æt/',words:['at','bat','cat','fat','hat','mat','rat','sat']},
 {fam:'-et',vowel:'e',ipa:'/e/',words:['bet','get','jet','let','met','net','pet','set']},
 {fam:'-ig',vowel:'i',ipa:'/ɪ/',words:['dig','fig','big','pig','rig','wig']},
 {fam:'-og',vowel:'o',ipa:'/ɒ/',words:['bog','dog','fog','hog','log','mug']},
 {fam:'-ub',vowel:'u',ipa:'/ʌ/',words:['bub','cub','dub','rub','tub','sub']},
 {fam:'-an',vowel:'a',ipa:'/æn/',words:['ban','can','dan','fan','man','pan','ran','tan']},
];

const MAGIC_E=[
 {short:'cap',long:'cape',ipa_s:'/æ/',ipa_l:'/eɪ/',cn_s:'帽子',cn_l:'披风'},
 {short:'hop',long:'hope',ipa_s:'/ɒ/',ipa_l:'/əʊ/',cn_s:'跳',cn_l:'希望'},
 {short:'kit',long:'kite',ipa_s:'/ɪ/',ipa_l:'/aɪ/',cn_s:'工具包',cn_l:'风筝'},
 {short:'cub',long:'cube',ipa_s:'/ʌ/',ipa_l:'/ju:/',cn_s:'幼兽',cn_l:'立方体'},
 {short:'pen',long:'pane',ipa_s:'/e/',ipa_l:'/eɪ/',cn_s:'钢笔',cn_l:'窗格'},
 {short:'mat',long:'mate',ipa_s:'/æ/',ipa_l:'/eɪ/',cn_s:'垫子',cn_l:'伙伴'},
];

const VOWEL_R=[
 {combo:'ar',ipa:'/ɑ:/',example:'car',cn:'汽车',tip:'ar发音像"啊"'},
 {combo:'er',ipa:'/ə/',example:'teacher',cn:'老师',tip:'er在词尾发轻音'},
 {combo:'ir',ipa:'/ɜ:/',example:'bird',cn:'鸟',tip:'ir发音长音'},
 {combo:'or',ipa:'/ɔ:/',example:'corn',cn:'玉米',tip:'or发音像"哦"'},
 {combo:'ur',ipa:'/ɜ:/',example:'nurse',cn:'护士',tip:'ur发音和er相似'},
 {combo:'ear',ipa:'/ɪə/',example:'ear',cn:'耳朵',tip:'ear发音像"伊儿"'},
];

const BLENDS=[
 {blend:'bl',words:['blue','black','blow','block','blend'],cn:'bl组合',ipa:'/bl/'},
 {blend:'cl',words:['class','clean','clock','cloud','clap'],cn:'cl组合',ipa:'/kl/'},
 {blend:'br',words:['bread','bridge','brown','break','bring'],cn:'br组合',ipa:'/br/'},
 {blend:'cr',words:['crab','crate','cry','cross','cream'],cn:'cr组合',ipa:'/kr/'},
 {blend:'tr',words:['tree','train','truck','trip','track'],cn:'tr组合',ipa:'/tr/'},
 {blend:'fl',words:['flower','fly','flag','flat','flock'],cn:'fl组合',ipa:'/fl/'},
 {blend:'pr',words:['prince','print','prize','proof','pray'],cn:'pr组合',ipa:'/pr/'},
 {blend:'dr',words:['drum','dress','drive','drop','dream'],cn:'dr组合',ipa:'/dr/'},
];

const DIGRAPHS=[
 {dg:'sh',ipa:'/ʃ/',example:'ship',cn:'船',hint:'像老师叫嘘'},
 {dg:'ch',ipa:'/tʃ/',example:'chair',cn:'椅子',hint:'发音类似吃'},
 {dg:'th(清)',ipa:'/θ/',example:'three',cn:'三',hint:'舌头放在牙齿间'},
 {dg:'th(浊)',ipa:'/ð/',example:'this',cn:'这',hint:'舌头放牙齿间声带振动'},
 {dg:'ph',ipa:'/f/',example:'phone',cn:'电话',hint:'ph发音就是f'},
 {dg:'wh',ipa:'/w/',example:'what',cn:'什么',hint:'wh发音接近w'},
 {dg:'wh(h)',ipa:'/hw/',example:'white',cn:'白色',hint:'wh发h+w音'},
 {dg:'kn',ipa:'/n/',example:'know',cn:'知道',hint:'k不发音'},
 {dg:'wr',ipa:'/r/',example:'write',cn:'写',hint:'w不发音'},
 {dg:'mb',ipa:'/m/',example:'lamb',cn:'羔羊',hint:'b不发音'},
];

// ─── 语音合成（多方案回退）───
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices();}
loadVoices();
if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=loadVoices;

function speak(text){
  if(!speechSynthesis) return;
  speechSynthesis.cancel();
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.85; u.pitch=1.1;
    const voices=speechSynthesis.getVoices();
    const v=voices.find(x=>/Google US|Samantha|Female.*English/.test(x.name))||voices.find(x=>x.lang==='en-US')||voices[0];
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){console.warn('TTS failed:',e);}
}

// ─── 状态 ──
let state={
  game:'letters',
  questions:[],
  idx:0,
  correct:0,
  wrong:0,
  wrongAttempts:0,
  stars:{letters:0,families:0,magnetice:0,vowelR:0,blends:0,digraphs:0},
};
function ts(){return Object.values(state.stars).reduce((a,b)=>a+b,0);}
function refreshStarsUI(){
  document.getElementById('totalStars').textContent=ts();
  for(const g in state.stars) {const el=document.getElementById('s-'+g);if(el) el.textContent='⭐ '+state.stars[g]+'/6';}
}

// ─── 工具 ──
function shuffle(arr){return arr.slice().sort(()=>Math.random()-0.5);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ─── 渲染游戏卡片 ──
const GAME_DEFS=[
 {id:'letters',icon:'🔤',title:'字母发音',desc:'26字母 · 听听猜猜',en:'26 Letters · Letter Sounds'},
 {id:'families',icon:'📦',title:'词族填空',desc:'短元音词族',en:'Short Vowel Families'},
 {id:'magnetice',icon:'✨',title:'魔术E',desc:'短音→长音',en:'Magic E Transformation'},
 {id:'vowelR',icon:'🌈',title:'元音+r',desc:'ar er ir or ur',en:'Vowel + r Sounds'},
 {id:'blends',icon:'🧩',title:'辅音组合',desc:'bl cl br cr tr',en:'Consonant Blends'},
 {id:'digraphs',icon:'🎯',title:'双字母音',desc:'sh ch th wh ph',en:'Double Letter Sounds'},
];

function renderGameGrid(){
  const grid=document.getElementById('gameGrid');
  grid.innerHTML=GAME_DEFS.map(d=>`
    <div class="game-card ${state.game===d.id?'active':''}" data-game="${d.id}">
      <span class="icon">${d.icon}</span>
      <div class="title">${d.title}</div>
      <div class="desc">${d.desc}<br><span style="color:var(--sky2)">${d.en}</span></div>
      <div class="stars" id="s-${d.id}">⭐ 0/6</div>
    </div>`).join('');
  // 使用 addEventListener 而非 onclick，避免单引号转义问题
  grid.querySelectorAll('.game-card').forEach(card=>{
    card.addEventListener('click',()=>selectGame(card.dataset.game));
  });
}

function selectGame(g){
  state.game=g; state.idx=0; state.correct=0; state.wrong=0; state.wrongAttempts=0; state.questions=[];
  renderGameGrid();
  startGame(g);
}

function startGame(g){
  const area=document.getElementById('gameArea');
  if(g==='letters'){
    const letters=shuffle(LETTERS).slice(0,6);
    state.questions=letters.map(it=>{
      const wrong=LETTERS.filter(x=>x.l!==it.l).sort(()=>Math.random()-0.5).slice(0,3);
      const opts=[it.l,...wrong.map(x=>x.l)].sort(()=>Math.random()-0.5);
      return {type:'letter',word:it.word,ipa:it.ipa,cn:it.cn,letter:it.l,opts:opts,answer:it.l,tip:it.tip};
    });
    renderLetterGame();
  } else if(g==='families'){
    const fams=shuffle(FAMILIES).slice(0,6);
    state.questions=fams.map(f=>{
      const allVowels=['a','e','i','o','u'];
      const wrong=allVowels.filter(v=>v!==f.vowel).sort(()=>Math.random()-0.5).slice(0,3);
      const opts=[f.vowel,...wrong].sort(()=>Math.random()-0.5);
      const word=f.words[Math.floor(Math.random()*f.words.length)];
      return {type:'family',word:word,ipa:f.ipa,fam:f.fam,opts:opts,answer:f.vowel};
    });
    renderFamilyGame();
  } else if(g==='magnetice'){
    const pairs=shuffle(MAGIC_E).slice(0,6);
    state.questions=pairs.map(p=>{
      const allVowels=['a','e','i','o','u'];
      const rightVowel=p.short[0];
      const wrong=allVowels.filter(v=>v!==rightVowel).sort(()=>Math.random()-0.5).slice(0,3);
      const opts=[rightVowel,...wrong].sort(()=>Math.random()-0.5);
      return {type:'magic',short:p.short,long:p.long,ipa_s:p.ipa_s,ipa_l:p.ipa_l,cn_s:p.cn_s,cn_l:p.cn_l,opts:opts,answer:rightVowel};
    });
    renderMagicGame();
  } else if(g==='vowelR'){
    const items=shuffle(VOWEL_R).slice(0,6);
    state.questions=items.map(it=>{
      const allCombos=['ar','er','ir','or','ur','ear'];
      const wrong=allCombos.filter(c=>c!==it.combo).sort(()=>Math.random()-0.5).slice(0,3);
      const opts=[it.combo,...wrong].sort(()=>Math.random()-0.5);
      return {type:'vowelR',combo:it.combo,ipa:it.ipa,example:it.example,cn:it.cn,opts:opts,answer:it.combo,tip:it.tip};
    });
    renderVowelRGame();
  } else if(g==='blends'){
    const blends=shuffle(BLENDS).slice(0,6);
    state.questions=blends.map(b=>{
      const word=b.words[Math.floor(Math.random()*b.words.length)];
      const allBlends=['bl','cl','br','cr','tr','fl','pr','dr'];
      const wrong=allBlends.filter(x=>x!==b.blend).sort(()=>Math.random()-0.5).slice(0,3);
      const opts=[b.blend,...wrong].sort(()=>Math.random()-0.5);
      return {type:'blend',word:word,blend:b.blend,ipa:b.ipa,opts:opts,answer:b.blend,cn:b.cn};
    });
    renderBlendGame();
  } else if(g==='digraphs'){
    const items=shuffle(DIGRAPHS).slice(0,6);
    state.questions=items.map(it=>{
      const allDG=['sh','ch','th','ph','wh','kn','wr','mb'];
      const wrong=allDG.filter(x=>x!==it.dg).sort(()=>Math.random()-0.5).slice(0,3);
      const opts=[it.dg,...wrong].sort(()=>Math.random()-0.5);
      return {type:'digraph',dg:it.dg,ipa:it.ipa,example:it.example,cn:it.cn,hint:it.hint,opts:opts,answer:it.dg};
    });
    renderDigraphGame();
  }
}

// 通用 stats HTML
function statsHTML(){
  return `<div class="stats-row"><span class="stat correct-stat">✅ ${state.correct}</span><span class="stat wrong-stat">❌ ${state.wrong}</span><span class="stat">📝 ${state.idx+1}/${state.questions.length}</span></div>`;
}

function nextQuestion(){state.idx++; renderCurrent();}
function renderCurrent(){
  const m={letters:renderLetterGame,families:renderFamilyGame,magnetice:renderMagicGame,vowelR:renderVowelRGame,blends:renderBlendGame,digraphs:renderDigraphGame};
  const fn=m[state.game]; if(fn) fn();
}

// ─── 字母游戏 ──
function renderLetterGame(){
  const area=document.getElementById('gameArea');
  if(state.idx>=state.questions.length){renderComplete();return;}
  const q=state.questions[state.idx];
  const tip=q.tip||'';
  const html=`
  <div class="question-card">
    <div class="q-category">🔤 字母发音 · Letter Sounds</div>
    <div class="q-word">${q.word.toUpperCase()}</div>
    <div class="q-ipa">${esc(q.ipa)}</div>
    <div class="q-meaning">这个单词是 <strong>${q.cn}</strong>，它开头发哪个字母的音？</div>
    ${q.wrongHint?'<div class="q-tip">💡 提示：字母 '+q.letter+' 在闭音节中发 '+esc(q.ipa)+'。'+esc(q.tip)+'</div>':''}
    <button class="q-play" data-play="${esc(q.word)}">🔊 听发音 Listen</button>
  </div>
  <div class="opts">
    ${q.opts.map(o=>`<button class="opt" data-ans="${esc(o)}">${o.toUpperCase()}</button>`).join('')}
  </div>
  ${statsHTML()}`;
  area.innerHTML=html;
  bindOptClick(area, q.answer, (isCorrect)=>{
    if(isCorrect){
      state.correct++; state.stars.letters=Math.min(6,state.stars.letters+1); refreshStarsUI();
      speak(q.word);
      setTimeout(()=>nextQuestion(),1500);
    } else {
      state.wrong++;
      if(!q.wrongHint){q.wrongHint=true; renderLetterGame();}
      else {setTimeout(()=>nextQuestion(),800);}
    }
  });
  area.querySelector('[data-play]').addEventListener('click',function(){speak(this.dataset.play);});
}

// ─── 通用选项点击绑定（data-ans 属性） ──
function bindOptClick(area, correctAnswer, onResult){
  area.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',function(){
      if(this.classList.contains('dim')) return;
      const ans=this.dataset.ans;
      if(ans===correctAnswer){
        this.classList.add('correct');
        area.querySelectorAll('.opt').forEach(b=>b.classList.add('dim'));
        onResult(true);
      } else {
        this.classList.add('wrong');
        setTimeout(()=>this.classList.remove('wrong'),500);
        onResult(false);
      }
    });
  });
}

// ─── 完成 ──
function renderComplete(){
  const starsEarned=state.stars[state.game]||0;
  let starsText=''; for(let i=0;i<starsEarned;i++) starsText+='⭐';
  document.getElementById('gameArea').innerHTML=`
  <div class="complete show">
    <div class="trophy">🏆</div>
    <h2>恭喜你完成本关！</h2>
    <div class="stats">答对 <strong style="color:var(--grass2)">${state.correct}</strong> · 答错 <strong style="color:var(--coral2)">${state.wrong}</strong><br>获得 <strong>${starsEarned}</strong> 颗星 — ${starsText}</div>
    <p style="font-size:13px;color:var(--ink2);margin-top:8px">从顶部游戏卡片中选择下一关继续挑战</p>
  </div>`;
}
